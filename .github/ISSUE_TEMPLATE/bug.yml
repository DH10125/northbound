name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["type: testing"]
body:
  - type: textarea
    id: behavior
    attributes: { label: Observed behavior }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      {
        label: Reproduction,
        description: Include seed and command sequence when applicable.,
      }
    validations: { required: true }
  - type: textarea
    id: context
    attributes: { label: Browser and save/version context }
